{% set name = "opentelemetry-instrumentation-elasticsearch" %}
{% set version = "0.63b0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/opentelemetry_instrumentation_elasticsearch-{{ version }}.tar.gz
  sha256: 4d1453685e9cf3d682160880d2a8e5697b5f8afffd70f4c7e9f03e19a65cd36f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation ==0.63b0
    - opentelemetry-semantic-conventions ==0.63b0
    - wrapt <3.0.0,>=1.0.0
    # - opentelemetry-test-utils ==0.37b0
    # - opentelemetry-instrumentation-elasticsearch 
    # - elasticsearch-dsl >=2.0
